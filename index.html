<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRLHOST.NO Sceneskifter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .btn {
            background-color: #0284c7;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .file-info {
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IRLHOST.NO</h1>
        <p style="color: #94a3b8; margin-bottom: 25px;">Sceneskifter for Twitch & OBS</p>
        
        <!-- Bytt ut 'din-fil.zip' med lenken til zip-filen din -->
        <a href="din-fil.zip" class="btn" download>Last ned sceneskifter</a>
        
        <div class="file-info">
            Viser fil: <strong>sceneskifter.zip</strong> (Passordbeskyttet)
        </div>
